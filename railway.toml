[build]
buildCommand = "npm run build:server"

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Set in Railway dashboard → Variables (recommended):
# SERVE_CLIENT=false
# NODE_ENV=production
# SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_DATABASE_URL, SESSION_SECRET, ADMIN_PASSWORD
# SITE_URL, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_PRICE_SINGER_PRO, STRIPE_PRICE_ORG_PRO (see SETUP-STRIPE.md)
