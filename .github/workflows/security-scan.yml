name: Security Signature Scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for known supply-chain backdoor signatures
        shell: bash
        run: |
          set -uo pipefail
          FAIL=0

          echo "== Checking for obfuscator.io-style packed payload signature =="
          # Matches both while(![]){try{ and the real-world while(!![]){try{ variant
          HITS=$(grep -rlE 'while\(!!?\[\]\)\{try\{' --include='*' -- . 2>/dev/null | grep -v '^\./\.git/' || true)
          if [ -n "$HITS" ]; then
            echo "::error::Obfuscated payload signature found in:"
            echo "$HITS"
            FAIL=1
          fi

          echo "== Checking package.json scripts for a suspicious 'node init &&' prefix =="
          HITS=$(grep -lE '"[a-zA-Z0-9:_-]+"[[:space:]]*:[[:space:]]*"node init[[:space:]]*&&' $(find . -name package.json -not -path '*/node_modules/*' -not -path './.git/*') 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::error::package.json runs 'node init' before a real script in:"
            echo "$HITS"
            FAIL=1
          fi

          echo "== Checking .vscode/tasks.json for hidden folderOpen auto-run tasks =="
          if [ -f .vscode/tasks.json ] && grep -q 'folderOpen' .vscode/tasks.json; then
            echo "::error::.vscode/tasks.json contains a runOn: folderOpen task - review it before merging."
            FAIL=1
          fi

          echo "== Checking .vscode/settings.json for disabled auto-run confirmation =="
          if [ -f .vscode/settings.json ] && grep -qE '"task.allowAutomaticTasks"[[:space:]]*:[[:space:]]*true' .vscode/settings.json; then
            echo "::error::.vscode/settings.json sets task.allowAutomaticTasks: true (suppresses VS Code's confirmation prompt) - review it."
            FAIL=1
          fi

          echo "== Checking for disguised .orc files (not a real font/asset format) =="
          ORC=$(find . -iname '*.orc' -not -path './.git/*' 2>/dev/null || true)
          if [ -n "$ORC" ]; then
            echo "::error::Suspicious .orc file(s) found:"
            echo "$ORC"
            FAIL=1
          fi

          echo "== Checking for a root-level 'init' file with no extension =="
          if [ -f ./init ]; then
            echo "::error::Root-level 'init' file found at repo root - this matches a known backdoor loader pattern. Review it before merging."
            FAIL=1
          fi

          if [ "$FAIL" = "1" ]; then
            echo ""
            echo "Security scan FAILED - see errors above."
            exit 1
          fi
          echo "Security scan passed - no known backdoor signatures found."
