# Simple CI: GitHub runs this automatically on every PR and every push to main.
#
# Flow:
#   1. Checkout the code
#   2. Install npm packages
#   3. Typecheck (npm run check)
#   4. Run unit tests (npm run test:unit)
#
# If any step fails, the GitHub check is red — merge only after it is green.
# Deploy is still handled by Vercel (frontend) and Railway (API) when you push/merge.
# Playwright (npm test) stays local for now; it needs a running server.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm run test:unit
